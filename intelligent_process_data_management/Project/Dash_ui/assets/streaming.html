<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 팩토리 대시보드 with 실시간 스트리밍</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        /* 스트리밍 배경 레이어 */
        #stream-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .stream-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            opacity: 0.7; /* 배경으로 사용하기 위해 투명도 조절 */
            transition: opacity 0.3s ease;
        }
        
        /* 대시보드 오버레이 레이어 */
        #dashboard-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 10;
            pointer-events: none; /* 대시보드 요소만 클릭 가능하도록 */
        }
        
        #dashboard-overlay > * {
            pointer-events: auto; /* 자식 요소들은 클릭 가능 */
        }
        
        /* 스트리밍 상태 표시 (작게) */
        #stream-status {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00ff00;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            min-width: 150px;
            text-align: center;
        }
        
        /* 로딩 인디케이터 */
        #loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #666;
            font-size: 18px;
            text-align: center;
            z-index: 2;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        .spinner {
            border: 3px solid #333;
            border-top: 3px solid #00bfff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 스트리밍 없을 때 기본 배경 */
        #default-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            z-index: 0;
        }
        
        /* 네트워크 품질 인디케이터 */
        #network-indicator {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            z-index: 100;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .signal-bar {
            width: 3px;
            height: 12px;
            background: #333;
            margin-right: 1px;
            border-radius: 1px;
        }
        
        .signal-bar.active {
            background: #00ff00;
        }
        
        /* 키보드 힌트 */
        #keyboard-hints {
            position: fixed;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #aaa;
            padding: 10px;
            border-radius: 5px;
            font-size: 11px;
            z-index: 100;
            backdrop-filter: blur(5px);
            max-width: 300px;
            transition: opacity 0.3s ease;
        }
        
        /* 성능 모니터 */
        #performance-monitor {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.8);
            color: #00bfff;
            padding: 10px;
            border-radius: 5px;
            font-size: 11px;
            z-index: 100;
            backdrop-filter: blur(5px);
            font-family: 'Courier New', monospace;
            display: none; /* 기본적으로 숨김 */
        }
        
        /* 상태별 색상 */
        .status-success { color: #00ff00; }
        .status-error { color: #ff4444; }
        .status-warning { color: #ffaa00; }
        .status-info { color: #00bfff; }
        
        .hidden { display: none !important; }
        
        /* 전체화면 모드 */
        .fullscreen #keyboard-hints,
        .fullscreen #network-indicator,
        .fullscreen #performance-monitor {
            opacity: 0.3;
        }
        
        /* 애니메이션 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .stream-image {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        /* 연결 상태 애니메이션 */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-info {
            animation: pulse 2s infinite;
        }
